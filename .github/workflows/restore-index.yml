name: Restore homepage
on:
  push:
    paths:
      - .github/workflows/restore-index.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git checkout 9c43781d77d996c743360d06d9c4348200cd9bbe -- index.html
          git rm .github/workflows/restore-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore homepage from stable revision"
          git push
