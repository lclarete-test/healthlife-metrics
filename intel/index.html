<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="1;url=https://predictive-research-livia.lclarete.chatgpt.site">
  <title>HealthLife Metrics & Analytics | Intelligence</title>
  <style>
    :root{--ink:#092d32;--lime:#b9e876;--paper:#081012;--muted:#b9c9c6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:white;font:16px/1.6 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(620px,100%);padding:48px;border:1px solid #294447;border-radius:18px;background:#0e1a1c;box-shadow:0 28px 80px rgba(0,0,0,.35)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:42px;font-weight:700}
    .mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--lime);color:var(--ink)}
    small{display:block;color:var(--lime);text-transform:uppercase;letter-spacing:.12em}
    h1{margin:8px 0 16px;font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.04em}
    p{color:var(--muted)}
    a{display:inline-flex;margin-top:20px;padding:13px 18px;border-radius:7px;background:var(--lime);color:var(--ink);font-weight:750;text-decoration:none}
    @media(max-width:560px){main{padding:32px 24px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">H</span><span>HealthLife Metrics &amp; Analytics</span></div>
    <small>Private intelligence workspace</small>
    <h1>Opening your secure dashboard</h1>
    <p>This area requires an authorized account. You will be asked to sign in if your session is not active.</p>
    <a href="https://predictive-research-livia.lclarete.chatgpt.site">Open secure workspace</a>
  </main>
</body>
</html>
